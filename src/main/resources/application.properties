spring.application.name=LotterySystem

logging.config =  classpath:logback-spring.xml
spring.profiles.active=dev

## MySql ##
#驱动类名称
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#数据库连接的url
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lottery_system?
characterEncoding=utf8&useSSL=false
#连接数据库的用户名
spring.datasource.username=root
#连接数据库的密码
spring.datasource.password=Xing460354
## MyBatis ##
#配置mybatis xml的文件路径，在 resources/mapper 创建所有表的 xml 文件
#mybatis.mapper-locations=classpath:mapper/*Mapper.xml
#配置驼峰自动转换
mybatis.configuration.map-underscore-to-camel-case=true

mybatis.type-handlers-package = com.xzj.lotterysystem.dao.hander